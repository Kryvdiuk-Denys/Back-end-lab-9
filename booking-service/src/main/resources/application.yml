spring:
  application:
    name: booking-service

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:coworking}
    password: ${RABBITMQ_PASSWORD:coworking}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: true

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    overwrite-existing-jobs: true
    wait-for-jobs-to-complete-on-shutdown: true
    properties:
      org:
        quartz:
          scheduler:
            instanceName: coworkingQuartzScheduler
            instanceId: AUTO
          threadPool:
            class: org.quartz.simpl.SimpleThreadPool
            threadCount: 4
            threadPriority: 5
          jobStore:
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
            tablePrefix: QRTZ_
            isClustered: true
            clusterCheckinInterval: 15000
            misfireThreshold: 60000

  datasource:
    url: ${BOOKING_DB_URL:jdbc:postgresql://localhost:5433/coworking}
    username: ${BOOKING_DB_USERNAME:coworking}
    password: ${BOOKING_DB_PASSWORD:coworking}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/coworking}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/coworking/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8080}

services:
  workspace:
    base-url: ${WORKSPACE_SERVICE_URL:http://localhost:8082}
    client-type: ${WORKSPACE_CLIENT_TYPE:http}
    service-token: ${WORKSPACE_SERVICE_TOKEN:local-workspace-token}
    http:
      connect-timeout: ${WORKSPACE_HTTP_CONNECT_TIMEOUT:2s}
      read-timeout: ${WORKSPACE_HTTP_READ_TIMEOUT:3s}
    grpc:
      target: ${WORKSPACE_GRPC_TARGET:localhost:9090}
      deadline: ${WORKSPACE_GRPC_DEADLINE:2s}

booking:
  async:
    core-pool-size: 4
    max-pool-size: 4
    queue-capacity: 50
    thread-name-prefix: booking-async-
    side-effect-delay-ms: 1000
    lookup-delay-ms: 1000
    preparation-timeout-ms: 2500

logging:
  level:
    org.springframework.security: INFO
