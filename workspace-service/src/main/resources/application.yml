spring:
  application:
    name: workspace-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:coworking}
    password: ${RABBITMQ_PASSWORD:coworking}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: true
  datasource:
    url: ${WORKSPACE_DB_URL:jdbc:postgresql://localhost:5434/workspaces}
    username: ${WORKSPACE_DB_USERNAME:coworking}
    password: ${WORKSPACE_DB_PASSWORD:coworking}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/coworking}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/coworking/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8082}

security:
  internal-service-token: ${WORKSPACE_SERVICE_TOKEN:local-workspace-token}

workspace:
  grpc:
    server:
      enabled: ${WORKSPACE_GRPC_SERVER_ENABLED:false}
      port: ${WORKSPACE_GRPC_SERVER_PORT:9090}
