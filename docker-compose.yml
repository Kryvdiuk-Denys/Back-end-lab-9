services:
  postgres:
    image: postgres:16-alpine
    container_name: coworking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coworking
      POSTGRES_USER: coworking
      POSTGRES_PASSWORD: coworking
    ports:
      - "5433:5432"
    volumes:
      - booking-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coworking"]
      interval: 5s
      timeout: 5s
      retries: 10

  workspace-db:
    image: postgres:16-alpine
    container_name: coworking-workspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: workspaces
      POSTGRES_USER: coworking
      POSTGRES_PASSWORD: coworking
    ports:
      - "5434:5432"
    volumes:
      - workspace-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coworking -d workspaces"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: coworking-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-coworking}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-coworking}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: coworking-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      postgres:
        condition: service_healthy

  workspace-service:
    build:
      context: .
      dockerfile: workspace-service/Dockerfile
    container_name: coworking-workspace-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      WORKSPACE_DB_URL: jdbc:postgresql://workspace-db:5432/workspaces
      WORKSPACE_DB_USERNAME: coworking
      WORKSPACE_DB_PASSWORD: coworking
      WORKSPACE_SERVICE_TOKEN: ${WORKSPACE_SERVICE_TOKEN:-local-workspace-token}
      WORKSPACE_GRPC_SERVER_ENABLED: ${WORKSPACE_GRPC_SERVER_ENABLED:-false}
      WORKSPACE_GRPC_SERVER_PORT: ${WORKSPACE_GRPC_SERVER_PORT:-9090}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-coworking}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-coworking}
      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/coworking
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/coworking/protocol/openid-connect/certs
    ports:
      - "8082:8082"
      - "9090:9090"
    depends_on:
      workspace-db:
        condition: service_healthy
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    container_name: coworking-booking-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      BOOKING_DB_URL: jdbc:postgresql://postgres:5432/coworking
      BOOKING_DB_USERNAME: coworking
      BOOKING_DB_PASSWORD: coworking
      WORKSPACE_SERVICE_URL: http://workspace-service:8082
      WORKSPACE_SERVICE_TOKEN: ${WORKSPACE_SERVICE_TOKEN:-local-workspace-token}
      WORKSPACE_CLIENT_TYPE: ${WORKSPACE_CLIENT_TYPE:-http}
      WORKSPACE_GRPC_TARGET: ${WORKSPACE_GRPC_TARGET:-workspace-service:9090}
      WORKSPACE_GRPC_DEADLINE: ${WORKSPACE_GRPC_DEADLINE:-2s}
      WORKSPACE_HTTP_CONNECT_TIMEOUT: ${WORKSPACE_HTTP_CONNECT_TIMEOUT:-2s}
      WORKSPACE_HTTP_READ_TIMEOUT: ${WORKSPACE_HTTP_READ_TIMEOUT:-3s}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-coworking}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-coworking}
      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/coworking
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/coworking/protocol/openid-connect/certs
      KEYCLOAK_AUTHORIZATION_URI: http://localhost:8081/realms/coworking/protocol/openid-connect/auth
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/coworking/protocol/openid-connect/token
      KEYCLOAK_USER_INFO_URI: http://keycloak:8080/realms/coworking/protocol/openid-connect/userinfo
      KEYCLOAK_LOGOUT_URI: http://localhost:8081/realms/coworking/protocol/openid-connect/logout
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      workspace-service:
        condition: service_started
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_healthy

volumes:
  booking-data:
  workspace-data:
  rabbitmq-data:
